<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <link href="style.css" rel="stylesheet" type="text/css" />
        <link href="reset.css" rel="stylesheet" type="text/css" />
    </head>
    <body>
        <div id="cadDiv" style="opacity:0; pointer-events:none;">
            <div class="content">
                <div id="homeButton"></div>
                <div id="tabletCamera"></div>
                <!-- Edit the src field below with your custom link, if used. You can also resize the tablet frame.-->
                <iframe id="cadFrame" src="https://sonorancad.com/" width="1280" height="640"></iframe>
            </div>
        </div>

        <button id="displayExit" type="button" hidden>Exit computer</button>
        <div id="hudDiv" style="opacity:0; pointer-events:none;">
            <div id="hudFrame">
                <div id="hudHeader">
                    <div id="hudHeaderCalls">0/0</div>
                    <div id="hudHeaderTime">SONORAN</div>
                    <div id="hudHeaderControls">
                        <button type="button" class="control" aria-label="Mini CAD help" onclick="showHelp();">?</button>
                        <button type="button" class="control" aria-label="Close Mini CAD" onclick="moduleVisible('hud', false);">&times;</button>
                    </div>
                </div>
                <div id="hudContent" tabindex="0" aria-label="Call summary">
                    <span id="callCode">loading data...</span>
                    <span id="callTitle">loading data...</span>
                    <span id="callLocation">loading data...</span>
                    <span id="callUnits" tabindex="0" aria-label="Attached units">
                        <span id="nounits">No units are attached to this call.</span>
                        <!-- <span class="unit">103</span>
                        <span class="unit">105</span>
                        <span class="unit">205</span>
                        <span class="unit">518</span>
                        <span class="unit">ENGINE 3</span>
                        <span class="unit">RESCUE 15</span>
                        <span class="unit">MEDIC 16</span>
                        <span class="unit">LADDER 1</span>
                        <span class="unit">CAR 4</span> -->
                    </span>
                </div>
                <div id="hudFooter">
                    <button id="btnPrevCall" type="button" aria-label="Previous call" disabled onclick="prevCall();">&#8249; Prev</button>
                    <button id="btnAttach" type="button" disabled onclick="attach();">Attach</button>
                    <button id="btnDetail" type="button" aria-controls="hudDetails" aria-pressed="false" disabled onclick="toggleDetail();">Details</button>
                    <button id="btnNextCall" type="button" aria-label="Next call" disabled onclick="nextCall();">Next &#8250;</button>
                </div>
            </div>
            <div id="hudDetails" tabindex="0" aria-label="Call details" style="display: none;">
                <span class="label">Description:</span>
                <span id="callDescription">loading...</span>
                <span class="label">Call Notes:</span>
                <span id="callNotes"></span>
            </div>
            <div id="hudInput" style="display: none;">
                <input type="text" id="newnote" aria-label="New call note" />
                <input type="button" id="addnote" aria-label="Add note" value=">" />
            </div>
        </div>


        <script src="notepad-sync.js" type="text/javascript"></script>
        <script src="script.js" type="text/javascript"></script>
        <script src="display-surface.js" type="text/javascript"></script>
    </body>
</html>
